    <div class="home-container">
        <section>
        <carousel [interval]="myInterval">
            <slide>
            <img src="assets/banner1.jpg" alt="first slide" style="display: block; width: 100%; height:500px; object-fit: cover;">
            </slide>
            <slide>
            <img src="assets/banner2.jpg" alt="second slide" style="display: block; width: 100%; height:500px; object-fit: cover;">
            </slide>
            <slide>
            <img src="assets/banner3.jpg" alt="third slide" style="display: block; width: 100%; height:500px; object-fit: cover;">
            </slide>
        </carousel>
    </section>
    <section class="categories mt-5">
        <div class="row">
            <div class="col-12 mb-3 d-flex justify-content-between align-items-end">
                <h1>Shop by category</h1>
                <a class="see-all" routerLink="/shop">View all</a>
            </div>
            <owl-carousel-o [options]="customOptions">
              @for (slide of slidesStore; track slide.id) {
                <ng-template carouselSlide [id]="slide.id">
                  <a class="category-card" [routerLink]="['/shop', slide.slug]">
                    <img [src]="slide.src" [alt]="slide.alt" [title]="slide.title">
                    <h2>{{ slide.title }}</h2>
                  </a>
                </ng-template>
              }
            </owl-carousel-o>
        </div>
    </section>
    <section class="popular-product mt-5">
        <div class="row">
            <div class="col-12 mb-3 d-flex justify-content-between align-items-end">
                <h1>Popular products</h1>
                <a class="see-all" routerLink="/shop">Shop the collection</a>
            </div>
        </div>
        <div class="product-grid">
            @for (product of popular; track product.id) {
                <app-product-card [product]="product" />
            }
        </div>
    </section>
</div>
