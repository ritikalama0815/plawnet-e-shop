<section class="page-block">
  <h1>Account</h1>
  <p class="lead">Sign in to track orders and saved items.</p>
  <form class="account-card" (submit)="$event.preventDefault()">
    <label>
      Email
      <input type="email" class="form-control" placeholder="you@email.com" />
    </label>
    <label>
      Password
      <input type="password" class="form-control" placeholder="••••••••" />
    </label>
    <button type="submit" class="account-btn">Continue</button>
    <p class="hint">currently its frontend only</p>
  </form>
</section>
